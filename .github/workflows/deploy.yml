name: Deploy to GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp cache name and app version with release tag
        run: |
          sed -i "s/const CACHE_NAME = '[^']*';/const CACHE_NAME = 'pokelogger-shell-${GITHUB_REF_NAME}-${GITHUB_SHA::7}';/" sw.js
          grep CACHE_NAME sw.js
          printf '{\n  "version": "%s"\n}\n' "${GITHUB_REF_NAME#v}" > version.json
          cat version.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
